<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Sociuni</title>
</head>

<body>

    <div class="logo d-flex row justify-content-center align-items-center vh-100 p-3">
        <div class="col-md-6">
            <div class="d-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-people-fill fs-4 text-white"></i>
                <h2 class="fw-bold text-white">Sociuni</h2>
            </div>
        </div>
        <div class="col-md-6">
            <div class="login-card">
                <h2 class="fw-bold text-center mb-4">Criar Conta</h2>

                <form method="POST">
                    <div class="input-group mb-3">
                        <span class="input-group-text color-dark"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control text-white rounded-end-2" placeholder="Usuário">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"> <i class="bi bi-key"></i> </span>
                        <input type="password" class="form-control text-white rounded-end-2" placeholder="senha">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"> <i class="bi bi-key-fill"></i> </span>
                        <input type="password" id="password" class="form-control text-white rounded-end-2"
                            placeholder="Confirme sua senha">
                        <a href="javascript:;" onclick="showHide()" class="icon"> <i class="bi bi-eye fs-5"></i> <i
                                class="bi bi-eye-slash fs-5"></i> </a>
                    </div>

                    <button type="submit" class="btn btn-light w-100 fw-semibold text-white"> Cadastrar </button>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
